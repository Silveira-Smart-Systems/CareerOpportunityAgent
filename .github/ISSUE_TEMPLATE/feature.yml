name: Feature
description: Propose a traceable product or engineering feature
title: "feat: "
labels: []
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective and user value
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Link FR/AC/NFR IDs where applicable.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and dependencies
